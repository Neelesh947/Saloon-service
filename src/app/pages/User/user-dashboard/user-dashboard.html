<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Saloon-List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" routerLink="/">Neelesh-Saloon-Project</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUser">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarUser">
        <!-- Left-side menu -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/services" routerLinkActive="active-link">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/user-dashboard/saloons" routerLinkActive="active-link">Saloons</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/bookings" routerLinkActive="active-link">Bookings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/history" routerLinkActive="active-link">History</a>
          </li>
        </ul>

        <!-- Search -->
        <form class="d-flex mx-auto" (ngSubmit)="onSearch()">
          <input class="form-control me-2" type="search"
                 placeholder="Search salon or service..."
                 [(ngModel)]="searchQuery"
                 name="search" />
          <button class="btn btn-warning text-white">Search</button>
        </form>

        <!-- Right-side icons -->
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item me-3 position-relative">
            <a class="nav-link" (click)="openNotifications()">
              <i class="bi bi-bell fs-5"></i>
              <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                {{ notifications.length }}
              </span>
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown">
              <img src="https://picsum.photos/35/35" class="rounded-circle me-2" />
              {{ userName }}
            </a>
          </li>

          <a class="nav-link text-white" (click)="logout()">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </a>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ROUTED CONTENT (JUST BELOW NAVBAR) -->
  <div class="router-container">
    <router-outlet></router-outlet>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
