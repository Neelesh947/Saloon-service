<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Saloon-List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" routerLink="/">Neelesh-Saloon-Project</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUser"
        aria-controls="navbarUser" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarUser">
        <!-- Left-side menu items -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/services" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/saloons" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }">Saloons</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/bookings" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }">Bookings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/history" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }">History</a>
          </li>
        </ul>

        <!-- Search form -->
        <form class="d-flex mx-auto my-2 my-lg-0" role="search" (ngSubmit)="onSearch()">
          <input class="form-control me-2" type="search" placeholder="Search salon or service..." aria-label="Search"
            [(ngModel)]="searchQuery" name="search" />
          <button class="btn btn-warning text-white" type="submit">Search</button>
        </form>

        <!-- Right-side icons -->
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
          <li class="nav-item me-3 position-relative">
            <a class="nav-link" href="javascript:void(0)" (click)="openNotifications()">
              <i class="bi bi-bell fs-5"></i>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                {{ notifications.length }}
              </span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="javascript:void(0)" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              <img src="https://picsum.photos/35/35" alt="Profile" class="rounded-circle me-2" />
              {{ userName }}
            </a>
          </li>
          <a class="nav-link text-white" href="#" (click)="logout()" title="Logout">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </a>
        </ul>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
