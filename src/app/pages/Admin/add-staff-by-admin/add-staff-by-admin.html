<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div class="add-staff-wrapper">
    <div class="overlay"></div>

    <div class="container h-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg add-staff-card">
            <div class="card-body">

                <h3 class="text-center mb-4 fw-bold">
                    Add New Staff
                </h3>

                <form [formGroup]="staffForm" (ngSubmit)="onSubmit()">

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" formControlName="firstName" placeholder="Enter staff  first name" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" formControlName="lastName" placeholder="Enter staff last name" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">User Name</label>
                        <input type="text" class="form-control" formControlName="username" placeholder="Enter staff user name" />
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email"
                            placeholder="Enter email address" />
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" formControlName="phone"
                            placeholder="Enter phone number" />
                    </div>

                    <!-- Services -->
                    <div class="mb-4">
                        <label class="form-label">Assign Services</label>

                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                {{ selectedServicesNames }}
                            </button>


                            <ul class="dropdown-menu w-100 p-2">
                                <li *ngFor="let service of services">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" [id]="'service-' + service.id"
                                            [value]="service.id"
                                            [checked]="staffForm.value.serviceIds.includes(service.id)"
                                            (change)="toggleService(service.id, $event.target.checked)" />
                                        <label class="form-check-label" [for]="'service-' + service.id">
                                            {{ service.name }}
                                        </label>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>


                    <!-- Buttons -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" [disabled]="staffForm.invalid || loading">
                            {{ loading ? 'Saving...' : 'Add Staff' }}
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
