<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Profile Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-sm p-4" style="max-width: 900px; width: 100%; border-radius: 10px;">
    <div class="col-md-12" *ngFor="let salon of saloons">
      <div class="card-header bg-primary text-white mb-4 rounded">
        <h4 class="mb-0">{{ salon.saloonName }}</h4>
      </div>
      <div class="row gx-5">
        <!-- Left Column: Profile Info -->
        <div class="col-md-7">
          <!-- Only render form if profileForms[salon.id] exists -->
          <form *ngIf="profileForms[salon.id]" [formGroup]="profileForms[salon.id]">
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label fw-semibold">Saloon Name</label>
                <input type="text" class="form-control" formControlName="saloonName" placeholder="Enter Saloon Name" />
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Phone</label>
                <input type="text" class="form-control" formControlName="phone" placeholder="Enter Phone Number" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Address</label>
              <textarea class="form-control" formControlName="address" rows="3" placeholder="Enter Address"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Services</label>
              <div class="d-flex flex-wrap gap-2">
                <span *ngFor="let service of salon.services" class="badge bg-info text-dark px-3 py-2 rounded-pill">
                  {{ service.name }}
                </span>
              </div>
            </div>

            <button type="button" class="btn btn-success mt-3 px-4" (click)="saveProfile(salon.id)">
              Save Profile
            </button>
          </form>
        </div>

        <!-- Right Column: Password Update -->
        <div class="col-md-5 border-start ps-4">
          <h5 class="mb-4 fw-bold">Update Password</h5>
          <!-- Only render form if passwordForms[salon.id] exists -->
          <form *ngIf="passwordForms[salon.id]" [formGroup]="passwordForms[salon.id]">
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" class="form-control" formControlName="newPassword" placeholder="New Password" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input type="password" class="form-control" formControlName="confirmPassword"
                placeholder="Confirm Password" />
            </div>
            <button type="button" class="btn btn-warning mt-2 px-4" (click)="updatePassword(salon.id)">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
