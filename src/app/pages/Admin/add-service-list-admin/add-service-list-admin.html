<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Saloon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add New Service</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">

            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Service Name</label>
              <input type="text" id="name" class="form-control" formControlName="name" placeholder="Enter service name">
              <div *ngIf="serviceForm.get('name')?.touched && serviceForm.get('name')?.invalid"
                class="text-danger mt-1">
                <small *ngIf="serviceForm.get('name')?.errors?.['required']">Name is required.</small>
                <small
                  *ngIf="serviceForm.get('name')?.errors?.['minlength'] || serviceForm.get('name')?.errors?.['maxlength']">
                  Name must be between 3 and 100 characters.
                </small>
              </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" formControlName="description"
                placeholder="Enter description" rows="2"></textarea>
              <div *ngIf="serviceForm.get('description')?.touched && serviceForm.get('description')?.invalid"
                class="text-danger mt-1">
                <small *ngIf="serviceForm.get('description')?.errors?.['required']">Description is required.</small>
                <small *ngIf="serviceForm.get('description')?.errors?.['maxlength']">Description cannot exceed 255
                  characters.</small>
              </div>
            </div>

            <!-- Category -->
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" formControlName="category">
                <option value="" disabled selected>Select category</option>
                <option value="HAIRCUT">HAIRCUT</option>
                <option value="MANICURE">MANICURE</option>
                <option value="PEDICURE">PEDICURE</option>
                <option value="MASSAGE">MASSAGE</option>
                <option value="FACIAL">FACIAL</option>
                <option value="OTHER">OTHER</option>
              </select>
              <div *ngIf="serviceForm.get('category')?.touched && serviceForm.get('category')?.invalid"
                class="text-danger mt-1">
                <small *ngIf="serviceForm.get('category')?.errors?.['required']">Category is required.</small>
              </div>
            </div>


            <!-- Duration -->
            <div class="mb-3">
              <label for="durationInMinutes" class="form-label">Duration (minutes)</label>
              <input type="number" id="durationInMinutes" class="form-control" formControlName="durationInMinutes"
                placeholder="Enter duration">
              <div
                *ngIf="serviceForm.get('durationInMinutes')?.touched && serviceForm.get('durationInMinutes')?.invalid"
                class="text-danger mt-1">
                <small *ngIf="serviceForm.get('durationInMinutes')?.errors?.['required']">Duration is required.</small>
                <small *ngIf="serviceForm.get('durationInMinutes')?.errors?.['min']">Duration must be at least 1
                  minute.</small>
              </div>
            </div>

            <!-- Price -->
            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input type="number" id="price" class="form-control" formControlName="price" placeholder="Enter price">
              <div *ngIf="serviceForm.get('price')?.touched && serviceForm.get('price')?.invalid"
                class="text-danger mt-1">
                <small *ngIf="serviceForm.get('price')?.errors?.['required']">Price is required.</small>
                <small *ngIf="serviceForm.get('price')?.errors?.['min']">Price cannot be negative.</small>
              </div>
            </div>

            <!-- Active -->
            <div class="mb-3 form-check form-switch">
              <input class="form-check-input" type="checkbox" id="active" formControlName="active">
              <label class="form-check-label" for="active">Active</label>
            </div>

            <!-- Submit -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="serviceForm.invalid">Submit</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
