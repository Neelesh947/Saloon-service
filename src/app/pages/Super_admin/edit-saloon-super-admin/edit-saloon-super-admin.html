<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Saloon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="edit-saloon-container">
    <h2>Edit Saloon</h2>

    <form class="edit-saloon-form">
        <!-- Saloon Name -->
        <div class="form-group">
            <label for="saloonName">Saloon Name</label>
            <input type="text" id="saloonName" name="saloonName" [(ngModel)]="saloon.saloonName" required>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" [(ngModel)]="saloon.address" rows="3" required></textarea>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" [(ngModel)]="saloon.phone" required>
        </div>

        <!-- Active Status -->
        <div class="form-group toggle-group">
            <label for="active">Active</label>
            <input type="checkbox" id="active" name="active" [(ngModel)]="saloon.active">
        </div>

        <!-- Created By (read-only) -->
        <div class="form-group">
            <label for="createdBy">Created By</label>
            <input type="text" id="createdBy" name="createdBy" [value]="saloon.createdBy" readonly>
        </div>

        <!-- Timestamps (read-only) -->
        <div class="form-row">
            <div class="form-group">
                <label for="createdAt">Created At</label>
                <input type="text" id="createdAt" name="createdAt" [value]="saloon.createdAt | date:'short'" readonly>
            </div>
            <div class="form-group">
                <label for="updatedAt">Updated At</label>
                <input type="text" id="updatedAt" name="updatedAt" [value]="saloon.updatedAt | date:'short'" readonly>
            </div>
        </div>

        <!-- Save Button -->
        <div class="form-actions">
            <button type="submit" (click)="saveSaloon()" class="btn-save">
                <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
            <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
        </div>
    </form>
</div>
