<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Navbar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<div class="sidebar" [class.closed]="isClosed">
  <div class="sidebar-header">
    <h3>SuperAdmin</h3>
    <button class="btn-toggle" (click)="toggleSidebar()">☰</button>
  </div>

  <div class="user-info">
    <p>Welcome, <strong>Admin</strong></p>
  </div>

  <ul class="menu">
    <li>
      <a [routerLink]="['/super-admin-dashboard/super-admin-analytics']">
        <i class="bi bi-bar-chart"></i>
        <span>Analytics</span>
      </a>
    </li>
    <li>
      <a [routerLink]="['/super-admin-dashboard/saloon-management-admin']">
        <i class="bi bi-building"></i>
        <span>Admin Management</span>
      </a>
    </li>
    <li>
      <a [routerLink]="['/super-admin-dashboard/user-management']">
        <i class="bi bi-people"></i>
        <span>Users Management</span>
      </a>
    </li>
    <li>
      <a [routerLink]="['/super-admin-dashboard/staff-management']">
        <i class="bi bi-grid"></i>
        <span>Staff Management</span>
      </a>
    </li>
    <li>
      <a [routerLink]="['/super-admin-dashboard/serivce-management']">
        <i class="bi bi-grid"></i>
        <span>Service Management</span>
      </a>
    </li>
  </ul>
  <div class="logout-section">
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </button>
  </div>
</div>
