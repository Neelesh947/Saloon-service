<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="edit-saloon-container">
    <h2>Edit User</h2>

    <form class="edit-saloon-form">
        <!-- First Name -->
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" [(ngModel)]="user.firstName" required>
        </div>

        <!-- Last Name -->
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" [(ngModel)]="user.lastName" required>
        </div>

        <div class="form-group">
            <label for="email">Email Id</label>
            <input type="text" id="email" name="email" [(ngModel)]="user.email" required>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" [(ngModel)]="phoneNumber" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <textarea id="lastName" name="address" [(ngModel)]="address" rows="3" required></textarea>
        </div>

        <!-- Enable Status -->
        <div class="form-group toggle-group">
            <label for="enable">Active</label>
            <input type="checkbox" id="enable" name="enable" [(ngModel)]="user.enable">
        </div>
        <!-- Save Button -->
        <div class="form-actions">
            <button type="submit" (click)="saveUser()" class="btn-save">
                <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
            <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
        </div>
    </form>
</div>
