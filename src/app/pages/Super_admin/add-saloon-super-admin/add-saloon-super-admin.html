<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Saloon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add New Saloon</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="saloonForm" (ngSubmit)="onSubmit()">
            
            <!-- Saloon Name -->
            <div class="mb-3">
              <label for="saloonName" class="form-label">Saloon Name</label>
              <input 
                type="text" 
                id="saloonName" 
                class="form-control" 
                formControlName="saloonName" 
                placeholder="Enter saloon name">
              <div *ngIf="saloonForm.get('saloonName')?.touched && saloonForm.get('saloonName')?.invalid" class="text-danger mt-1">
                <small *ngIf="saloonForm.get('saloonName')?.errors?.['required']">Saloon name is required.</small>
                <small *ngIf="saloonForm.get('saloonName')?.errors?.['minlength'] || saloonForm.get('saloonName')?.errors?.['maxlength']">
                  Saloon name must be between 3 and 100 characters.
                </small>
              </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <textarea 
                id="address" 
                class="form-control" 
                formControlName="address" 
                placeholder="Enter address" 
                rows="2"></textarea>
              <div *ngIf="saloonForm.get('address')?.touched && saloonForm.get('address')?.invalid" class="text-danger mt-1">
                <small *ngIf="saloonForm.get('address')?.errors?.['required']">Address is required.</small>
                <small *ngIf="saloonForm.get('address')?.errors?.['maxlength']">Address cannot exceed 255 characters.</small>
              </div>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input 
                type="text" 
                id="phone" 
                class="form-control" 
                formControlName="phone" 
                placeholder="Enter phone number">
              <div *ngIf="saloonForm.get('phone')?.touched && saloonForm.get('phone')?.invalid" class="text-danger mt-1">
                <small *ngIf="saloonForm.get('phone')?.errors?.['required']">Phone number is required.</small>
                <small *ngIf="saloonForm.get('phone')?.errors?.['minlength'] || saloonForm.get('phone')?.errors?.['maxlength']">
                  Phone number must be valid (8-15 characters).
                </small>
              </div>
            </div>

            <!-- Active Flag -->
            <div class="mb-3 form-check form-switch">
              <input 
                class="form-check-input" 
                type="checkbox" 
                id="active" 
                formControlName="active">
              <label class="form-check-label" for="active">Active</label>
              <div *ngIf="saloonForm.get('active')?.touched && saloonForm.get('active')?.invalid" class="text-danger mt-1">
                <small *ngIf="saloonForm.get('active')?.errors?.['required']">Active flag must be provided.</small>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="saloonForm.invalid">Submit</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
