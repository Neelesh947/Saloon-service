<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add New Admin</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="adminForm" (ngSubmit)="onSubmit()">

            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" class="form-control" formControlName="username" placeholder="Enter username">
              <div *ngIf="adminForm.get('username')?.touched && adminForm.get('username')?.invalid" class="text-danger mt-1">
                <small *ngIf="adminForm.get('username')?.errors?.['required']">Username is required.</small>
                <small *ngIf="adminForm.get('username')?.errors?.['minlength'] || adminForm.get('username')?.errors?.['maxlength']">
                  Username must be 3-50 characters.
                </small>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="emailAddress" class="form-label">Email</label>
              <input type="email" id="emailAddress" class="form-control" formControlName="emailAddress" placeholder="Enter email">
              <div *ngIf="adminForm.get('emailAddress')?.touched && adminForm.get('emailAddress')?.invalid" class="text-danger mt-1">
                <small *ngIf="adminForm.get('emailAddress')?.errors?.['required']">Email is required.</small>
                <small *ngIf="adminForm.get('emailAddress')?.errors?.['email']">Invalid email format.</small>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter password">
              <div *ngIf="adminForm.get('password')?.touched && adminForm.get('password')?.invalid" class="text-danger mt-1">
                <small *ngIf="adminForm.get('password')?.errors?.['required']">Password is required.</small>
                <small *ngIf="adminForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</small>
              </div>
            </div>

            <!-- First Name -->
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" id="firstName" class="form-control" formControlName="firstName" placeholder="Enter first name">
            </div>

            <!-- Last Name -->
            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" id="lastName" class="form-control" formControlName="lastName" placeholder="Enter last name">
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="phoneNumber" class="form-label">Phone Number</label>
              <input type="text" id="phoneNumber" class="form-control" formControlName="phoneNumber" placeholder="Enter phone number">
              <div *ngIf="adminForm.get('phoneNumber')?.touched && adminForm.get('phoneNumber')?.invalid" class="text-danger mt-1">
                <small *ngIf="adminForm.get('phoneNumber')?.errors?.['required']">Phone number is required.</small>
                <small *ngIf="adminForm.get('phoneNumber')?.errors?.['minlength'] || adminForm.get('phoneNumber')?.errors?.['maxlength']">
                  Phone number must be 8-15 characters.
                </small>
              </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <textarea id="address" class="form-control" formControlName="address" rows="2" placeholder="Enter address"></textarea>
              <div *ngIf="adminForm.get('address')?.touched && adminForm.get('address')?.invalid" class="text-danger mt-1">
                <small *ngIf="adminForm.get('address')?.errors?.['required']">Address is required.</small>
                <small *ngIf="adminForm.get('address')?.errors?.['maxlength']">Address cannot exceed 255 characters.</small>
              </div>
            </div>

            <!-- Enabled -->
            <div class="mb-3 form-check form-switch">
              <input class="form-check-input" type="checkbox" id="isEnabled" formControlName="isEnabled">
              <label class="form-check-label" for="isEnabled">Enabled</label>
            </div>

            <!-- Submit -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="adminForm.invalid">Submit</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
