<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .login-image {
            background: url("https://m.media-amazon.com/images/I/61AKWBNngCL._SX679_.jpg") center center / cover no-repeat;
        }
    </style>
</head>

<div class="container-fluid user-bg">
    <div class="overlay"></div>

    <div class="row justify-content-center align-items-center min-vh-100 position-relative">
        <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10">

            <div class="card form-glass shadow-lg">
                <div class="card-body p-5">

                    <!-- Back Button -->
                    <div class="mb-3">
                        <button type="button" class="btn btn-link back-btn" (click)="goBack()">
                            <i class="bi bi-arrow-left"></i> Back
                        </button>
                    </div>


                    <h2 class="text-center fw-bold mb-2">Create Account</h2>
                    <p class="text-center text-muted mb-4">
                        Please fill in the details to create a new user
                    </p>

                    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">

                        <div class="row">
                            <!-- First Name -->
                            <div class="col-md-6 mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" name="firstName" ngModel
                                        placeholder="First Name" required>
                                </div>
                            </div>

                            <!-- Last Name -->
                            <div class="col-md-6 mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" name="lastName" ngModel
                                        placeholder="Last Name" required>
                                </div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" ngModel
                                    placeholder="Email Address" required>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control" name="phone" ngModel placeholder="Phone Number">
                            </div>
                        </div>

                        <!-- Username -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" name="username" ngModel placeholder="Username"
                                    required>
                            </div>
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                <textarea class="form-control" name="address" ngModel rows="2"
                                    placeholder="Address"></textarea>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" name="password" ngModel
                                    placeholder="Password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="userForm.invalid">
                            Create User
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
