<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .login-image {
      background: url("https://m.media-amazon.com/images/I/61AKWBNngCL._SX679_.jpg") center center / cover no-repeat;
    }
  </style>
</head>

<body>

  <div class="container-fluid vh-100">
    <div class="row h-100">

      <!-- Left Section -->
      <div class="col-md-6 d-flex align-items-center justify-content-center login-bg">
        <div class="w-75">

          <h2 class="fw-bold mb-2">Welcome back</h2>
          <p class="text-muted mb-4">
            Welcome back! Please enter your details.
          </p>

          <form>
            <div *ngIf="errorMsg.length" class="alert alert-danger mt-3">
              <div *ngFor="let err of errorMsg">{{ err }}</div>
            </div>
            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input [(ngModel)]="requestBody.username" type="email" class="form-control" name="username"
                placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input [(ngModel)]="requestBody.password" type="password" class="form-control" name="password"
                placeholder="**********">
            </div>

            <!-- Options -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a href="forget-password" class="text-decoration-none">Forgot password</a>
            </div>

            <!-- Buttons -->
            <button class="btn btn-dark w-100 mb-3" (click)="login()">
              Sign in
            </button>

            <!-- <button type="button" class="btn btn-outline-secondary w-100">
            Sign in with Google
            </button> -->
          </form>

          <!-- Signup -->
          <p class="text-center mt-4">
            Don’t have an account?
            <a href="#" class="fw-bold text-decoration-none">Sign up for free!</a>
          </p>

          <p class="text-center mt-2">
            Are you a salon owner?
            <a href="/register-saloon" class="fw-bold text-decoration-none">
              Register your salon (for admin approval)
            </a>
          </p>

        </div>
      </div>

      <!-- Right Section -->
      <div class="col-md-6 d-none d-md-block login-image"></div>

    </div>
  </div>
</body>

</html>
