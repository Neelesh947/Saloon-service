<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .forgot-bg {
      background-color: #f7f3ef;
    }

    .forgot-image {
      background: url("https://m.media-amazon.com/images/I/61AKWBNngCL._SX679_.jpg")
        center center / cover no-repeat;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }
  </style>
</head>
<body>

<div class="container-fluid vh-100">
  <div class="row h-100">

    <!-- Left Section -->
    <div class="col-md-6 d-flex align-items-center justify-content-center forgot-bg">
      <div class="w-75">

        <h2 class="fw-bold mb-2">Forgot Password</h2>
        <p class="text-muted mb-4">
          Secure your account in a few steps.
        </p>

        <!-- STEP 1: Email -->
        <div class="step active" id="step1">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <button class="btn btn-dark w-100" onclick="goToStep(2)">
            Send OTP
          </button>
        </div>

        <!-- STEP 2: OTP -->
        <div class="step" id="step2">
          <div class="mb-3">
            <label class="form-label">Enter OTP</label>
            <input type="text" class="form-control" placeholder="Enter 6-digit OTP">
          </div>
          <button class="btn btn-dark w-100" onclick="goToStep(3)">
            Verify OTP
          </button>
        </div>

        <!-- STEP 3: Reset Password -->
        <div class="step" id="step3">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" placeholder="New password">
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" placeholder="Confirm password">
          </div>

          <button class="btn btn-dark w-100">
            Reset Password
          </button>
        </div>

        <p class="text-center mt-4">
          Remember your password?
          <a href="" class="fw-bold text-decoration-none">Back to login</a>
        </p>

      </div>
    </div>

    <!-- Right Section -->
    <div class="col-md-6 d-none d-md-block forgot-image"></div>

  </div>
</div>

<script>
  function goToStep(step) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
  }
</script>

</body>
</html>
